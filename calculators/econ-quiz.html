<div class="tq" id="tq">
<style>
.tq{max-width:560px;margin:0 auto;padding:20px 18px 22px;border:2px solid #1f6f4a;border-radius:14px;background:#fff;color:#1c2b24;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.6;box-sizing:border-box}
.tq *{box-sizing:border-box}
.tq h3{margin:0 0 6px;font-size:22px;line-height:1.35;color:#1c2b24}
.tq p{margin:0 0 12px;font-size:16px}
.tq .tq-sub{color:#4a5d54;font-size:15px}
.tq button{font-family:inherit;cursor:pointer}
.tq .tq-main{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:#1f6f4a;color:#fff;font-size:17px;font-weight:700}
.tq .tq-main:active{background:#17563a}
.tq .tq-bar{height:6px;border-radius:3px;background:#e3ece6;margin:0 0 14px;overflow:hidden}
.tq .tq-bar i{display:block;height:100%;width:0;background:#1f6f4a;transition:width .3s}
.tq .tq-meta{font-size:14px;color:#4a5d54;margin-bottom:6px}
.tq .tq-q{font-size:19px;font-weight:700;line-height:1.5;margin:0 0 14px}
.tq .tq-opt{display:block;width:100%;text-align:left;margin:0 0 9px;padding:13px 14px;border:1.5px solid #c9d8cf;border-radius:10px;background:#fff;color:#1c2b24;font-size:16px}
.tq .tq-opt:active{background:#eaf4ee}
.tq .tq-opt.ok{border-color:#1f6f4a;background:#e4f3ea;font-weight:700}
.tq .tq-opt.no{border-color:#b3402f;background:#fbebe8}
.tq .tq-opt[disabled]{cursor:default}
.tq .tq-exp{margin:4px 0 14px;padding:12px 14px;border-radius:10px;background:#f2f6f3;font-size:15px}
.tq .tq-exp b{display:block;margin-bottom:2px}
.tq .tq-score{font-size:56px;font-weight:800;line-height:1.1;color:#1f6f4a;margin:6px 0 0}
.tq .tq-score small{font-size:22px;font-weight:600;color:#4a5d54}
.tq .tq-title{font-size:21px;font-weight:700;margin:4px 0 8px}
.tq .tq-row{display:flex;gap:8px;margin-top:6px}
.tq .tq-row button{flex:1;padding:13px 8px;border-radius:10px;font-size:16px;font-weight:700}
.tq .tq-sec{border:1.5px solid #1f6f4a;background:#fff;color:#1f6f4a}
.tq .tq-note{margin:10px 0 0;font-size:13px;color:#6b7c73}
.tq button:focus-visible{outline:3px solid #8cc7a6;outline-offset:2px}
</style>
<div id="tq-app"></div>
<script>
(function(){
var Q=[
{q:"물가가 전반적으로 계속 오르는 현상을 무엇이라고 할까요?",a:["인플레이션","디플레이션","스태그플레이션","리디노미네이션"],c:0,e:"인플레이션은 물가가 지속적으로 오르는 현상이에요. 같은 돈으로 살 수 있는 물건이 줄어들어서 돈의 가치가 떨어지는 효과가 있어요."},
{q:"중앙은행이 기준금리를 올리면 일반적으로 대출 이자는 어떻게 될까요?",a:["오르는 경향이 있다","내리는 경향이 있다","전혀 영향이 없다","정부가 정한 값으로 고정된다"],c:0,e:"기준금리는 시중 금리의 기준이 돼요. 기준금리가 오르면 대출 금리도 함께 오르는 경향이 있어요."},
{q:"소득이 많을수록 더 높은 세율을 적용하는 방식은 무엇일까요?",a:["비례세","누진세","정액세","역진세"],c:1,e:"누진세는 소득이 늘수록 세율이 높아지는 방식이에요. 우리나라 소득세가 대표적이에요."},
{q:"직장인이 1년간 낸 세금을 다음 해 초에 다시 계산해서 더 냈으면 돌려받고 덜 냈으면 추가로 내는 절차는?",a:["종합소득세 신고","연말정산","원천징수","세액공제"],c:1,e:"연말정산은 월급에서 미리 떼어간 세금과 실제로 내야 할 세금의 차이를 정산하는 절차예요."},
{q:"경제는 성장하지 않는데 물가만 계속 오르는 상황을 무엇이라고 할까요?",a:["디플레이션","버블","스태그플레이션","리세션"],c:2,e:"스태그플레이션은 경기 침체와 물가 상승이 동시에 나타나는 상황이에요. 정책 대응이 까다로운 것으로 유명해요."},
{q:"원/달러 환율이 오르면 원화의 가치는 어떻게 될까요?",a:["올라간다","떨어진다","변하지 않는다","달러와 반대로 움직이지 않는다"],c:1,e:"환율이 오르면 달러 1개를 사는 데 더 많은 원이 필요하다는 뜻이에요. 그래서 원화 가치는 떨어진 거예요."},
{q:"이자에 다시 이자가 붙는 계산 방식을 무엇이라고 할까요?",a:["단리","복리","할인","상환"],c:1,e:"복리는 원금에 붙은 이자도 다음 이자 계산에 포함하는 방식이에요. 기간이 길수록 단리와 차이가 커져요."},
{q:"다음 중 간접세에 해당하는 것은?",a:["소득세","법인세","부가가치세","종합부동산세"],c:2,e:"부가가치세는 물건을 살 때 가격에 포함해 내는 세금이라 소비자가 부담하고 사업자가 대신 납부해요. 그래서 간접세예요."},
{q:"ETF는 무엇의 줄임말이고 어떤 상품일까요?",a:["거래소에서 주식처럼 사고파는 상장지수펀드","은행이 파는 정기예금 상품","정부가 발행하는 채권","해외에서만 거래되는 선물 계약"],c:0,e:"ETF는 상장지수펀드예요. 여러 종목을 묶어 만든 펀드를 주식처럼 실시간으로 사고팔 수 있어요."},
{q:"DSR은 무엇을 나타내는 비율일까요?",a:["연소득 대비 모든 대출의 연간 원리금 상환액 비율","집값 대비 대출 금액의 비율","월급 대비 저축 금액의 비율","자산 대비 부채의 비율"],c:0,e:"DSR은 총부채원리금상환비율이에요. 주택담보대출뿐 아니라 신용대출 등 모든 대출의 원리금이 연소득에서 차지하는 비중을 봐요."}
];
var POOL=Q.concat([
{q:"물가가 전반적으로 계속 떨어지는 현상을 무엇이라고 할까요?",a:["디플레이션","인플레이션","스태그플레이션","슈링크플레이션"],c:0,e:"디플레이션은 물가가 지속적으로 하락하는 현상이에요. 소비와 투자가 위축되기 쉬워 경제에 부담이 될 수 있어요."},
{q:"GDP(국내총생산)는 무엇을 나타낼까요?",a:["일정 기간 한 나라 안에서 새로 생산된 재화와 서비스의 시장 가치 합계","한 나라 국민이 가진 모든 재산의 합","정부가 1년 동안 쓰는 예산의 총액","수출액에서 수입액을 뺀 금액"],c:0,e:"GDP는 한 나라의 경제 규모를 가늠하는 대표 지표예요. 이미 있던 재산이 아니라 그 기간에 새로 만들어진 가치를 합친 거예요."},
{q:"중앙은행이 기준금리를 내리면 일반적으로 기대하는 효과는?",a:["대출 부담이 줄어 소비와 투자가 늘어나는 효과","대출 부담이 커져 소비가 줄어드는 효과","세금이 자동으로 줄어드는 효과","물가가 곧바로 고정되는 효과"],c:0,e:"금리 인하는 경기를 살리려는 목적으로 쓰여요. 다만 물가 상승이나 가계부채 증가 같은 부작용이 생길 수도 있어요."},
{q:"월급을 줄 때 회사가 세금을 미리 떼어 대신 납부하는 방식은?",a:["원천징수","연말정산","가산세","세액공제"],c:0,e:"원천징수는 소득을 지급하는 쪽이 세금을 먼저 떼서 국가에 내는 방식이에요. 월급명세서의 소득세가 이거예요."},
{q:"소득공제와 세액공제의 차이로 맞는 것은?",a:["소득공제는 세금을 계산하는 기준 소득을 줄이고, 세액공제는 계산된 세금을 직접 줄인다","소득공제는 계산된 세금을 직접 줄이고, 세액공제는 소득을 줄인다","둘은 이름만 다르고 똑같다","소득공제는 사업자만, 세액공제는 직장인만 받는다"],c:0,e:"소득공제는 세율을 곱하기 전 금액을 줄이고, 세액공제는 계산이 끝난 세금에서 바로 빼줘요. 항목마다 어느 쪽인지 달라요."},
{q:"세율을 곱하기 전에, 세금을 매기는 기준이 되는 금액을 무엇이라고 할까요?",a:["과세표준","총급여","산출세액","결정세액"],c:0,e:"과세표준에 세율을 곱하면 산출세액이 나와요. 세금 계산의 출발점이 되는 금액이라고 보면 돼요."},
{q:"다음 중 직접세에 해당하는 것은?",a:["소득세","부가가치세","개별소비세","관세"],c:0,e:"직접세는 세금을 내는 사람과 실제로 부담하는 사람이 같은 세금이에요. 소득세가 대표적이고, 나머지는 가격에 얹히는 간접세예요."},
{q:"주식이나 부동산 같은 자산을 팔아서 남긴 차익에 붙는 세금은?",a:["양도소득세","증여세","상속세","취득세"],c:0,e:"자산을 팔아 이익이 생기면 양도소득세 대상이 될 수 있어요. 자산 종류와 보유 조건에 따라 과세 여부와 세율이 달라요."},
{q:"다른 사람에게 재산을 무상으로 받았을 때, 받은 사람에게 매기는 세금은?",a:["증여세","양도소득세","재산세","종합소득세"],c:0,e:"증여세는 공짜로 재산을 받은 사람이 내는 세금이에요. 가족 사이에도 일정 금액을 넘으면 신고 대상이 될 수 있어요."},
{q:"개인이 1년 동안 번 사업소득, 이자, 배당 등 여러 소득을 합산해 신고하는 세금은?",a:["종합소득세","부가가치세","취득세","재산세"],c:0,e:"종합소득세는 보통 다음 해 5월에 신고하고 납부해요. 근로소득만 있는 직장인은 연말정산으로 끝나는 경우가 많아요."},
{q:"다음 중 4대 보험에 포함되지 않는 것은?",a:["실손의료보험","국민연금","고용보험","산업재해보상보험"],c:0,e:"4대 보험은 국민연금, 건강보험, 고용보험, 산재보험이에요. 실손의료보험은 개인이 민간 보험사에 따로 가입하는 상품이에요."},
{q:"소득이 적은 근로자·사업자 가구에 정부가 현금으로 지원하는 제도는?",a:["근로장려금","종합소득공제","양도세 감면","재산세 환급"],c:0,e:"근로장려금은 일해서 번 소득이 적은 가구에 지급해요. 소득과 재산 등 요건을 갖춰야 하고 직접 신청해야 받을 수 있어요."},
{q:"퇴직금을 받으려면 한 직장에서 계속 근무한 기간이 기본적으로 얼마 이상이어야 할까요?",a:["1년 이상","6개월 이상","2년 이상","3년 이상"],c:0,e:"계속 근로 기간이 1년 이상이고, 4주 평균 주 15시간 이상 일해야 퇴직금 대상이 돼요."},
{q:"실업급여(구직급여)를 받으려면 기본적으로 어떤 보험에 가입한 기간이 필요할까요?",a:["고용보험","국민연금","건강보험","산재보험"],c:0,e:"고용보험에 일정 기간 가입했고 비자발적으로 퇴사하는 등 요건을 충족해야 해요. 자세한 조건은 고용24에서 확인할 수 있어요."},
{q:"기업이 번 이익의 일부를 주주에게 나눠주는 돈을 무엇이라고 할까요?",a:["배당금","이자","임대료","퇴직금"],c:0,e:"배당금은 주식을 가진 주주가 받는 이익 분배금이에요. 배당을 얼마나 주는지는 회사마다 달라요."},
{q:"PER(주가수익비율)은 어떻게 계산할까요?",a:["주가 ÷ 주당순이익","주가 × 발행 주식 수","배당금 ÷ 주가","매출액 ÷ 주가"],c:0,e:"PER은 주가가 1주당 이익의 몇 배인지 보여줘요. 같은 업종의 다른 회사와 비교해서 보는 경우가 많아요."},
{q:"시가총액은 어떻게 계산할까요?",a:["주가 × 발행 주식 수","주당순이익 × 주식 수","매출액 − 영업비용","자산 − 부채"],c:0,e:"시가총액은 시장에서 그 회사 전체를 평가한 가치예요. 주가가 같아도 주식 수가 많으면 시가총액이 커져요."},
{q:"주식을 빌려서 먼저 팔고, 값이 내렸을 때 사서 갚는 거래를 무엇이라고 할까요?",a:["공매도","신용매수","분할매수","무상증자"],c:0,e:"공매도는 주가가 내릴 것을 예상하고 하는 거래예요. 주가가 오르면 오히려 손해를 볼 수 있어요."},
{q:"재무가 탄탄하고 오랫동안 안정적으로 이익을 내는 대형 우량주를 부르는 말은?",a:["블루칩","테마주","동전주","우선주"],c:0,e:"블루칩은 포커의 가장 비싼 칩에서 나온 말이에요. 우량한 대형주를 가리킬 때 써요."},
{q:"코스닥 시장은 상대적으로 어떤 기업이 많이 상장되어 있을까요?",a:["중소·벤처 및 성장 기업","대형 우량 기업만","외국 기업만","정부 출자 공기업만"],c:0,e:"코스닥은 중소·벤처와 성장 기업이 많이 상장된 시장이고, 코스피는 대형 기업 중심이에요."},
{q:"주가가 급락할 때 투자자가 진정할 시간을 주려고 거래를 잠시 멈추는 제도는?",a:["서킷브레이커","공개매수","감자","기준가 조정"],c:0,e:"서킷브레이커는 지수가 크게 떨어지면 일정 시간 매매를 멈추는 제도예요. 전기 회로의 차단기에서 따온 이름이에요."},
{q:"'달걀을 한 바구니에 담지 말라'는 투자 격언이 뜻하는 것은?",a:["분산투자","몰빵투자","단기투자","차입투자"],c:0,e:"한 종목이나 한 자산에 모든 돈을 넣지 말고 나눠 투자하라는 뜻이에요. 한쪽이 떨어져도 충격을 줄일 수 있어요."},
{q:"금리가 오르면 이미 발행된 채권의 가격은 일반적으로 어떻게 될까요?",a:["떨어진다","오른다","변하지 않는다","액면가로 고정된다"],c:0,e:"새로 나오는 채권이 더 높은 금리를 주니, 낮은 금리의 기존 채권은 매력이 줄어 가격이 내려가는 경향이 있어요."},
{q:"원/달러 환율이 오르면 일반적으로 어느 쪽에 유리할까요?",a:["수출 기업","해외여행을 가는 사람","미국으로 유학 간 자녀의 학비를 보내는 부모","수입 원자재를 쓰는 기업"],c:0,e:"원화가 약해지면 같은 달러 매출이 원화로 더 많이 환산돼 수출 기업에 유리한 경향이 있어요. 반대로 수입 물가는 오르기 쉬워요."},
{q:"우리나라에서 기준금리를 결정하는 곳은?",a:["한국은행 금융통화위원회","기획재정부","금융감독원","국세청"],c:0,e:"한국은행 금융통화위원회가 기준금리를 정해요. 보통 연 여러 차례 회의를 열어 결정해요."},
{q:"미국의 중앙은행을 부르는 이름은?",a:["연방준비제도(연준, Fed)","재무부","증권거래위원회(SEC)","국제통화기금(IMF)"],c:0,e:"연준은 미국의 통화정책을 맡는 중앙은행 제도예요. 연준의 금리 결정은 전 세계 금융시장에 영향을 줘요."},
{q:"FOMC는 어떤 회의일까요?",a:["미국 연준이 기준금리 등 통화정책을 결정하는 회의","미국 상장사들의 실적 발표 회의","세계 주요국 재무장관 회의","미국 의회의 예산 심사 회의"],c:0,e:"FOMC는 연방공개시장위원회예요. 이 회의 결과와 발표 내용에 따라 주식, 환율, 채권이 크게 움직이기도 해요."},
{q:"중앙은행이 국채 등을 사들여 시중에 돈을 푸는 정책은?",a:["양적완화","양적긴축","재정긴축","환율고정제"],c:0,e:"양적완화는 경기를 살리려고 시중에 돈을 푸는 정책이에요. 반대로 보유 자산을 줄여 돈을 거두는 걸 양적긴축이라고 해요."},
{q:"LTV는 무엇의 비율일까요?",a:["담보로 잡은 자산의 가치 대비 대출 금액","연소득 대비 모든 대출의 원리금 상환액","자기자본 대비 부채","월급 대비 월세"],c:0,e:"LTV는 담보인정비율이에요. 집값이 5억 원이고 LTV가 70%라면 최대 3.5억 원까지 빌릴 수 있다는 뜻이에요. 실제 한도는 다른 규제도 함께 따져요."},
{q:"원금 100만 원을 연 10% 복리로 2년 맡기면 원금과 이자의 합계는? (세금은 무시)",a:["121만 원","120만 원","110만 원","122만 원"],c:0,e:"1년 뒤 110만 원, 2년 뒤에는 110만 원의 10%인 11만 원이 더 붙어 121만 원이에요. 단리라면 120만 원이에요."},
{q:"72의 법칙으로 연 6% 복리 수익이면 원금이 두 배가 되는 데 걸리는 기간은 대략?",a:["약 12년","약 6년","약 18년","약 36년"],c:0,e:"72를 수익률로 나누면 대략의 기간이 나와요. 72 ÷ 6 = 12년이에요. 어림셈이라 정확한 값과는 조금 차이가 있어요."},
{q:"무언가를 선택하면서 포기한 대안 중 가장 가치가 큰 것을 무엇이라고 할까요?",a:["기회비용","매몰비용","고정비용","한계비용"],c:0,e:"기회비용은 선택하지 않은 것의 가치예요. 눈에 보이는 지출만이 아니라 포기한 시간과 기회도 비용으로 본다는 점이 포인트예요."},
{q:"다른 조건이 같을 때 가격이 오르면 수요량은 보통 어떻게 될까요?",a:["줄어든다","늘어난다","변하지 않는다","두 배가 된다"],c:0,e:"이를 수요의 법칙이라고 해요. 값이 비싸지면 덜 사게 되는 게 일반적이에요. 필수품은 줄어드는 폭이 작은 편이에요."},
{q:"명목금리가 연 5%이고 물가상승률이 연 3%라면 실질금리는 대략 얼마일까요?",a:["약 2%","약 5%","약 8%","약 15%"],c:0,e:"실질금리는 명목금리에서 물가상승률을 뺀 값이에요. 이자를 5% 받아도 물가가 3% 오르면 실제 구매력은 약 2%만 늘어요."},
{q:"흔히 쓰는 기술적 경기침체의 기준은 무엇일까요?",a:["2분기 연속 마이너스 성장","1분기 마이너스 성장","물가가 한 달 연속 하락","주가지수가 10% 하락"],c:0,e:"GDP가 2분기 연속 줄어들면 기술적 경기침체로 보는 경우가 많아요. 다만 나라마다 공식 판단 기준은 달라요."},
{q:"소비자물가지수(CPI)는 무엇을 보여줄까요?",a:["소비자가 사는 상품과 서비스의 가격 변동","기업 주가의 평균 변동","근로자 임금의 평균 변동","수출입 물품 가격의 변동"],c:0,e:"CPI는 우리가 생활에서 사는 물건과 서비스 가격이 얼마나 올랐는지를 보여주는 대표적인 물가 지표예요."},
{q:"수출액이 수입액보다 클 때를 무엇이라고 할까요?",a:["무역수지 흑자","무역수지 적자","재정 적자","환율 흑자"],c:0,e:"무역수지는 수출액에서 수입액을 뺀 값이에요. 플러스면 흑자, 마이너스면 적자예요."},
{q:"수입품에 부과하는 세금은 무엇일까요?",a:["관세","취득세","재산세","증권거래세"],c:0,e:"관세는 물건이 국경을 넘어 들어올 때 부과하는 세금이에요. 자국 산업 보호나 협상 수단으로도 쓰여요."},
{q:"일반적으로 신용점수가 높으면 대출 금리는 어떻게 되는 경향이 있을까요?",a:["낮아진다","높아진다","항상 같다","대출이 무조건 거절된다"],c:0,e:"돈을 잘 갚을 가능성이 높다고 평가받으면 금융회사가 더 낮은 금리를 제시하는 경향이 있어요."},
{q:"대출을 만기 전에 미리 갚을 때 금융회사에 내는 수수료는?",a:["중도상환수수료","인지세","연체이자","보증료"],c:0,e:"중도상환수수료는 대출 상품과 기간에 따라 달라요. 미리 갚을 계획이 있다면 대출 계약서에서 확인해두면 좋아요."}

var G=[[9,"경제 박사","뉴스 경제면이 술술 읽히는 수준이에요."],[7,"경제 고수","기본기가 탄탄해요. 조금만 더 보면 만점이에요."],[4,"경제 새싹","절반은 알고 있어요. 틀린 문제 해설만 읽어도 훌쩍 늘어요."],[0,"경제 입문자","지금부터 시작이에요. 해설을 읽고 다시 도전해보세요."]];
var app=document.getElementById("tq-app"),idx=0,score=0,order=[];
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}
function start(){app.innerHTML='<h3>세금·경제 용어 퀴즈</h3><p class="tq-sub">뉴스와 연말정산에 자주 나오는 용어 50문제 중 10문제가 무작위로 나와요. 풀 때마다 문제가 달라지고, 답을 고르면 해설이 바로 나와요.</p><button class="tq-main" id="tq-go" type="button">시작하기</button>';
document.getElementById("tq-go").onclick=function(){idx=0;score=0;Q=shuffle(POOL).slice(0,10);order=Q;show()}}
function show(){
var item=order[idx],opts=shuffle(item.a.map(function(t,i){return{t:t,r:i===item.c}}));
var h='<div class="tq-bar"><i style="width:'+(idx/Q.length*100)+'%"></i></div><div class="tq-meta">'+(idx+1)+' / '+Q.length+'</div><div class="tq-q">'+esc(item.q)+'</div><div id="tq-opts">';
opts.forEach(function(o,i){h+='<button class="tq-opt" type="button" data-i="'+i+'">'+esc(o.t)+'</button>'});
h+='</div><div id="tq-fb"></div>';app.innerHTML=h;
var btns=app.querySelectorAll(".tq-opt");
btns.forEach(function(b){b.onclick=function(){
var pick=opts[+b.getAttribute("data-i")];
btns.forEach(function(x,i){x.disabled=true;if(opts[i].r)x.classList.add("ok")});
if(pick.r){score++}else{b.classList.add("no")}
var last=idx===Q.length-1;
document.getElementById("tq-fb").innerHTML='<div class="tq-exp"><b>'+(pick.r?"정답이에요":"아쉬워요, 정답은 \""+esc(item.a[item.c])+"\"")+'</b>'+esc(item.e)+'</div><button class="tq-main" id="tq-next" type="button">'+(last?"결과 보기":"다음 문제")+'</button>';
document.getElementById("tq-next").onclick=function(){idx++;if(idx<Q.length){show()}else{result()}};
document.getElementById("tq-next").scrollIntoView({block:"nearest",behavior:"smooth"})}})}
function result(){
var g=G.filter(function(x){return score>=x[0]})[0];
var txt="세금·경제 용어 퀴즈 결과: "+score+"/"+Q.length+" ("+g[1]+")\n나도 풀어보기: "+location.href;
app.innerHTML='<div class="tq-bar"><i style="width:100%"></i></div><div class="tq-meta">결과</div><div class="tq-score">'+score+'<small> / '+Q.length+'</small></div><div class="tq-title">'+g[1]+'</div><p>'+g[2]+'</p><div class="tq-row"><button class="tq-sec" id="tq-copy" type="button">결과 복사하기</button><button class="tq-sec" id="tq-again" type="button">다시 풀기</button></div><p class="tq-note" id="tq-msg"></p>';
document.getElementById("tq-again").onclick=start;
document.getElementById("tq-copy").onclick=function(){
var m=document.getElementById("tq-msg");
function ok(){m.textContent="복사했어요. 카톡이나 문자에 붙여넣어 보세요."}
function fb(){var t=document.createElement("textarea");t.value=txt;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(e){m.textContent="복사에 실패했어요. 점수를 직접 공유해주세요."}document.body.removeChild(t)}
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,fb)}else{fb()}}}
start();
})();
</script>
