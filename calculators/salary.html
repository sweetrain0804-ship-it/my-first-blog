<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간편 연봉 및 실수령액 계산기</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen py-6 px-4">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-6">
        <h1 class="text-xl font-bold text-slate-800 mb-4 text-center">💰 간편 연봉 실수령액 계산기 (2026)</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">연봉 (원 또는 만원 단위 입력 가능)</label>
                <input type="number" id="salary" placeholder="예: 4800 또는 48000000" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-right">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">비과세액 (월)</label>
                <input type="number" id="taxFree" value="200000" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-right">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">부양가족수 (본인 포함)</label>
                <input type="number" id="dependents" value="1" min="1" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-right">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">20세 이하 자녀수</label>
                <input type="number" id="children" value="0" min="0" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-right">
            </div>

            <button onclick="calculate()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors">
                계산하기
            </button>
        </div>

        <div id="result" class="mt-6 border-t border-slate-200 pt-4 hidden">
            <h2 class="text-md font-semibold text-slate-800 mb-3">결과 요약 (2026 기준)</h2>
            <div class="space-y-2 text-sm">
                <div class="flex justify-between">
                    <span class="text-slate-600">월 총급여 (세전)</span>
                    <span id="resMonthlyGross" class="font-medium text-slate-900">0원</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-600">국민연금 (4.75%)</span>
                    <span id="resNationalPension" class="font-medium text-red-500">-0원</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-600">건강보험 (3.595%)</span>
                    <span id="resHealthInsurance" class="font-medium text-red-500">-0원</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-600">장기요양보험</span>
                    <span id="resLongTermCare" class="font-medium text-red-500">-0원</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-600">고용보험 (0.9%)</span>
                    <span id="resEmploymentInsurance" class="font-medium text-red-500">-0원</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-600">소득세 / 지방소득세</span>
                    <span id="resTax" class="font-medium text-red-500">-0원</span>
                </div>
                <div class="border-t border-slate-200 pt-2 mt-2 flex justify-between text-base font-bold">
                    <span class="text-slate-800">예상 월 실수령액</span>
                    <span id="resNetPay" class="text-blue-600">0원</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function calculate() {
            const salaryInput = document.getElementById('salary').value;
            const taxFreeInput = document.getElementById('taxFree').value;
            
            if (!salaryInput) {
                alert('연봉을 입력해주세요.');
                return;
            }

            let annualSalary = parseFloat(salaryInput);
            
            // 사용자가 만원 단위(예: 4800)로 입력했을 경우 원 단위(48,000,000)로 자동 보정
            if (annualSalary < 1000000) {
                annualSalary = annualSalary * 10000;
            }

            const monthlyTaxFree = parseFloat(taxFreeInput) || 0;
            const monthlyGross = annualSalary / 12;
            const taxableIncome = Math.max(0, monthlyGross - monthlyTaxFree);

            // 2026년 기준 4대 보험 계산 (근로자 부담분 요율 적용)
            // 1. 국민연금 (4.75%, 기준소득월액 상한 659만원 고려)
            const cappedPensionIncome = Math.min(taxableIncome, 6590000);
            const nationalPension = Math.floor(cappedPensionIncome * 0.0475 / 10) * 10;
            
            // 2. 건강보험 (3.595% - 2026년 전체 7.19%의 절반)
            const healthInsurance = Math.floor(taxableIncome * 0.03595 / 10) * 10;
            
            // 3. 장기요양보험 (건강보험료의 13.14%)
            const longTermCare = Math.floor(healthInsurance * 0.1314 / 10) * 10;
            
            // 4. 고용보험 (0.9%)
            const employmentInsurance = Math.floor(taxableIncome * 0.009 / 10) * 10;

            // 간이 소득세 추정
            let estimatedTax = taxableIncome * 0.03; 
            if (annualSalary > 50000000) estimatedTax = taxableIncome * 0.05;
            if (annualSalary > 80000000) estimatedTax = taxableIncome * 0.08;
            
            const incomeTax = Math.floor(estimatedTax / 10) * 10;
            const localIncomeTax = Math.floor(incomeTax * 0.1 / 10) * 10;
            const totalTax = incomeTax + localIncomeTax;

            const totalDeduction = nationalPension + healthInsurance + longTermCare + employmentInsurance + totalTax;
            const netPay = monthlyGross - totalDeduction;

            // 결과 반영
            document.getElementById('resMonthlyGross').innerText = formatNumber(Math.round(monthlyGross)) + '원';
            document.getElementById('resNationalPension').innerText = '-' + formatNumber(nationalPension) + '원';
            document.getElementById('resHealthInsurance').innerText = '-' + formatNumber(healthInsurance) + '원';
            document.getElementById('resLongTermCare').innerText = '-' + formatNumber(longTermCare) + '원';
            document.getElementById('resEmploymentInsurance').innerText = '-' + formatNumber(employmentInsurance) + '원';
            document.getElementById('resTax').innerText = '-' + formatNumber(totalTax) + '원';
            document.getElementById('resNetPay').innerText = formatNumber(Math.round(netPay)) + '원';

            document.getElementById('result').classList.remove('hidden');
        }
    </script>
</body>
</html>
