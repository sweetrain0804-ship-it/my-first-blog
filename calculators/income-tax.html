<style>
.jt-wrap{max-width:640px;margin:0 auto;padding:20px;border:1px solid #dde3ec;border-radius:12px;background:#fff;color:#1b2430;font-family:inherit;line-height:1.5;box-sizing:border-box}
.jt-wrap *{box-sizing:border-box}
.jt-title{font-size:20px;font-weight:700;margin:0 0 4px}
.jt-sub{font-size:14px;color:#5b6675;margin:0 0 18px}
.jt-field{margin-bottom:14px}
.jt-field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.jt-hint{font-size:12.5px;color:#6b7686;margin-top:4px}
.jt-input,.jt-select{width:100%;font-size:16px;padding:11px 12px;border:1px solid #c9d1dd;border-radius:8px;background:#fff;color:#1b2430;font-family:inherit}
.jt-input:focus,.jt-select:focus,.jt-btn:focus-visible,.jt-check input:focus-visible{outline:3px solid #9db8ff;outline-offset:1px}
.jt-check{display:flex;align-items:center;gap:8px;font-size:14px;margin:2px 0 14px}
.jt-check input{width:18px;height:18px;margin:0}
.jt-btn{font-size:14px;font-weight:600;padding:9px 16px;border:1px solid #c9d1dd;border-radius:8px;background:#fff;color:#1b2430;cursor:pointer;font-family:inherit}
.jt-result{margin-top:18px;background:#f3f6fa;border-radius:10px;padding:16px}
.jt-empty{font-size:14px;color:#5b6675;margin:0}
.jt-big-label{font-size:14px;color:#5b6675;margin:0}
.jt-big{font-size:30px;font-weight:800;margin:2px 0 12px;letter-spacing:-.5px}
.jt-pay{color:#1f4fd8}
.jt-refund{color:#147a3f}
.jt-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid #dde3ec;font-size:14px}
.jt-row span:last-child{font-weight:600;text-align:right}
.jt-note{font-size:12.5px;color:#6b7686;margin:14px 0 0}
</style>

<div class="jt-wrap" id="jt-root">
  <p class="jt-title">종합소득세 계산기</p>
  <p class="jt-sub">프리랜서·개인사업자 기준으로 세금을 간단히 계산해 볼 수 있어요.</p>

  <div class="jt-field">
    <label for="jt-rev">1년 총수입금액 (원)</label>
    <input class="jt-input" id="jt-rev" type="text" inputmode="numeric" autocomplete="off" placeholder="예: 40,000,000">
  </div>

  <div class="jt-field">
    <label for="jt-mode">필요경비 입력 방식</label>
    <select class="jt-select" id="jt-mode">
      <option value="amount">실제 경비 금액으로 입력</option>
      <option value="rate">경비율(%)로 입력</option>
    </select>
  </div>
  <div class="jt-field" id="jt-box-exp">
    <label for="jt-exp">필요경비 (원)</label>
    <input class="jt-input" id="jt-exp" type="text" inputmode="numeric" autocomplete="off" placeholder="예: 10,000,000">
  </div>
  <div class="jt-field" id="jt-box-rate" style="display:none">
    <label for="jt-rate">경비율 (%)</label>
    <input class="jt-input" id="jt-rate" type="text" inputmode="decimal" autocomplete="off" placeholder="예: 64.1">
    <div class="jt-hint">업종별 단순경비율·기준경비율은 홈택스에서 확인할 수 있어요.</div>
  </div>

  <div class="jt-field">
    <label for="jt-fam">부양가족 수 (본인 제외)</label>
    <input class="jt-input" id="jt-fam" type="text" inputmode="numeric" autocomplete="off" placeholder="0">
    <div class="jt-hint">본인 포함 1인당 기본공제 150만 원이 자동 반영돼요.</div>
  </div>

  <div class="jt-field">
    <label for="jt-ded">그 외 소득공제 (원)</label>
    <input class="jt-input" id="jt-ded" type="text" inputmode="numeric" autocomplete="off" placeholder="국민연금, 건강보험료, 노란우산 등">
  </div>

  <div class="jt-field">
    <label for="jt-credit">세액공제·감면 (원)</label>
    <input class="jt-input" id="jt-credit" type="text" inputmode="numeric" autocomplete="off" placeholder="표준세액공제 7만 원, 자녀세액공제 등">
  </div>

  <label class="jt-check"><input type="checkbox" id="jt-wh" checked> 3.3% 원천징수를 받았어요</label>
  <div class="jt-field">
    <label for="jt-pre">그 외 이미 낸 세금 (원)</label>
    <input class="jt-input" id="jt-pre" type="text" inputmode="numeric" autocomplete="off" placeholder="중간예납 등 (소득세 기준)">
  </div>

  <button type="button" class="jt-btn" id="jt-reset">입력 초기화</button>

  <div class="jt-result" id="jt-out" aria-live="polite"></div>
  <p class="jt-note">간이 계산 결과예요. 실제 세액은 소득 종류, 공제 항목, 가산세에 따라 달라지니 신고 전에 홈택스에서 꼭 확인하세요.</p>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var B=[[14000000,.06,0],[50000000,.15,1260000],[88000000,.24,5760000],[150000000,.35,15440000],[300000000,.38,19940000],[500000000,.40,25940000],[1000000000,.42,35940000],[Infinity,.45,65940000]];
  var money=['jt-rev','jt-exp','jt-ded','jt-credit','jt-pre'];
  function num(v){var n=parseInt(String(v).replace(/[^0-9]/g,''),10);return isNaN(n)?0:n}
  function won(n){return Math.abs(Math.round(n)).toLocaleString('ko-KR')+'원'}
  function tenFloor(n){return Math.floor(n/10)*10}
  function row(a,b){return '<div class="jt-row"><span>'+a+'</span><span>'+b+'</span></div>'}

  function calc(){
    var out=$('jt-out'), rev=num($('jt-rev').value);
    if(!rev){out.innerHTML='<p class="jt-empty">총수입금액을 입력하면 결과가 여기에 표시돼요.</p>';return}
    var exp;
    if($('jt-mode').value==='rate'){
      var r=parseFloat($('jt-rate').value.replace(/[^0-9.]/g,''));
      if(isNaN(r))r=0; if(r>100)r=100;
      exp=Math.floor(rev*r/100);
    }else{exp=num($('jt-exp').value)}
    exp=Math.min(exp,rev);
    var income=rev-exp;
    var fam=Math.min(num($('jt-fam').value),30);
    var ded=(1+fam)*1500000+num($('jt-ded').value);
    var base=Math.max(0,income-ded);
    var b=B[0];
    for(var i=0;i<B.length;i++){if(base<=B[i][0]){b=B[i];break}}
    var tax=Math.max(0,Math.floor(base*b[1]-b[2]));
    var fixed=Math.max(0,tax-num($('jt-credit').value));
    var local=tenFloor(fixed*0.1);
    var pre=($('jt-wh').checked?Math.floor(rev*0.03):0)+num($('jt-pre').value);
    var preLocal=tenFloor(pre*0.1);
    var diff=(fixed-pre)+(local-preLocal);
    var label=diff>0?'추가로 낼 세금':(diff<0?'돌려받을 세금':'정산할 세금');
    var cls=diff>0?'jt-pay':(diff<0?'jt-refund':'');
    var eff=income>0?((fixed+local)/income*100).toFixed(1)+'%':'0%';
    out.innerHTML=
      '<p class="jt-big-label">'+label+'</p>'+
      '<p class="jt-big '+cls+'">'+won(diff)+'</p>'+
      row('소득금액 (수입 − 경비)',won(income))+
      row('소득공제 합계',won(ded))+
      row('과세표준',won(base))+
      row('적용 세율',Math.round(b[1]*100)+'% (누진공제 '+(b[2]/10000).toLocaleString('ko-KR')+'만 원)')+
      row('산출세액',won(tax))+
      row('결정세액 (세액공제 후)',won(fixed))+
      row('지방소득세 (10%)',won(local))+
      row('이미 낸 세금 (소득세+지방소득세)',won(pre+preLocal))+
      row('실효세율 (소득금액 대비)',eff);
  }

  money.forEach(function(id){
    $(id).addEventListener('input',function(){
      var s=this.value.replace(/[^0-9]/g,'');
      this.value=s?Number(s).toLocaleString('ko-KR'):'';
      calc();
    });
  });
  ['jt-fam','jt-rate'].forEach(function(id){$(id).addEventListener('input',calc)});
  $('jt-wh').addEventListener('change',calc);
  $('jt-mode').addEventListener('change',function(){
    var rate=this.value==='rate';
    $('jt-box-exp').style.display=rate?'none':'block';
    $('jt-box-rate').style.display=rate?'block':'none';
    calc();
  });
  $('jt-reset').addEventListener('click',function(){
    money.concat(['jt-fam','jt-rate']).forEach(function(id){$(id).value=''});
    $('jt-wh').checked=true; $('jt-mode').value='amount';
    $('jt-box-exp').style.display='block'; $('jt-box-rate').style.display='none';
    calc();
  });
  calc();
})();
</script>
