name: Auto Generate YouTube Short

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies (ImageMagick & Nanum Font)
      run: |
        sudo apt-get update
        sudo apt-get install -y imagemagick fonts-nanum
        sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml || true

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-genai gtts moviepy

    - name: Run short generator script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python make_short.py

    - name: Upload generated short video
      uses: actions/upload-artifact@v4
      with:
        name: youtube-short-video
        path: output_short.mp4
