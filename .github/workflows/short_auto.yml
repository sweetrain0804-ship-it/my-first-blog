name: Auto Generate YouTube Short

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies (ImageMagick & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick fonts-nanum
          sudo sed -i '/rights="none" pattern="@\*"/d' /etc/ImageMagick-6/policy.xml

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install moviepy==1.0.3 google-generativeai requests

      - name: Run short generator script
        run: python make_short.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload generated short video
        uses: actions/upload-artifact@v3
        with:
          name: generated-short
          path: output_short.mp4
