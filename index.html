<!-- wp:paragraph -->
<p>고민되는 두 가지 메뉴를 입력해 보세요</p>
<!-- /wp:paragraph -->

<!-- wp:html -->
<div style="max-width: 500px; margin: 0 auto; padding: 22px; background: #ffffff; border-radius: 14px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #eaeaea;">
    <h3 style="text-align: center; color: #222; margin-bottom: 8px; font-size: 20px;">🧠 주관식 맞춤형 메뉴 판독기</h3>
    <p style="text-align: center; color: #666; font-size: 13px; margin-bottom: 20px; line-height: 1.4;">고민되는 두 가지 메뉴를 적어주세요!<br>오늘 날씨와 계절, 시간대에 칼로리 귀띔까지 싹 다 골라드립니다.</p>

    <div style="margin-bottom: 14px;">
        <label style="display: block; font-size: 13px; font-weight: bold; color: #444; margin-bottom: 6px;">고민 메뉴 1</label>
        <input type="text" id="menuA" placeholder="예: 족발" style="width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background: #fafafa;">
    </div>

    <div style="margin-bottom: 18px;">
        <label style="display: block; font-size: 13px; font-weight: bold; color: #444; margin-bottom: 6px;">고민 메뉴 2</label>
        <input type="text" id="menuB" placeholder="예: 회" style="width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background: #fafafa;">
    </div>

    <button onclick="recommendMenu()" style="width: 100%; padding: 14px; background: #ff5722; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(255,87,34,0.3);">오늘의 메뉴 판독하기!</button>

    <div id="resultBox" style="margin-top: 22px; padding: 18px; background: #fff8f6; border: 1px solid #ffd5cc; border-radius: 10px; display: none;">
        <p id="resultBadge" style="margin: 0 0 8px 0; color: #b57a6b; font-size: 12px;"></p>
        <h4 id="resultTitle" style="margin: 0 0 10px 0; color: #e64a19; font-size: 17px;"></h4>
        <p id="resultDesc" style="margin: 0 0 12px 0; color: #555; font-size: 14px; line-height: 1.6;"></p>
        <div id="resultPairing" style="margin-bottom: 4px; font-size: 14px; color: #333; font-weight: bold; background: #ffebee; padding: 8px 12px; border-radius: 6px;"></div>
        <p style="text-align: right; margin: 12px 0 0 0; font-size: 11px; color: #888;">💡 "음... 마음에 안 드는데?" 싶으면 다시 버튼을 눌러보세요!</p>
        <button onclick="recommendMenu()" style="width: 100%; margin-top: 12px; padding: 10px; background: transparent; color: #555; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; cursor: pointer;">다른 결과도 궁금하면 한 번 더</button>
    </div>
</div>

<script>
const seasonInfo = {
    spring: { name: "봄", desc: "선선한 봄바람 부는 날" },
    summer: { name: "여름", desc: "푹푹 찌는 더운 날" },
    autumn: { name: "가을", desc: "선선하고 입맛 도는 가을날" },
    winter: { name: "겨울", desc: "몸이 으슬으슬한 추운 날" }
};
const warmWords = ["족발","전골","국밥","국수","찌개","탕","전","보쌈","라면","치킨","삼겹살","곱창","순대","닭발","떡볶이","붕어빵","고구마"];
const coolWords = ["회","냉면","샐러드","초밥","물회","콩국수","비빔국수","냉국수","아이스크림","빙수"];
const menuPairings = {
    "족발": "족발 드실 땐 막국수 하나 곁들이는 거, 아시죠?",
    "보쌈": "보쌈엔 새우젓이랑 막걸리 한 잔이 진리죠.",
    "회": "회에는 매운탕이나 초장 진하게 곁들이시는 거 잊지 마세요.",
    "치킨": "치킨엔 역시 시원한 탄산음료가 국룰이죠.",
    "삼겹살": "삼겹살 다 구운 뒤에 볶음밥까지 가야 완성이에요.",
    "냉면": "냉면엔 만두 하나 시켜서 반씩 나눠 드시면 완벽해요.",
    "국밥": "국밥엔 깍두기 국물 살짝 부어 드시는 거 추천이요.",
    "떡볶이": "떡볶이엔 튀김 하나 찍어 드시는 재미가 빠지면 섭섭하죠.",
    "피자": "피자엔 콜라, 이건 국룰이라 설명이 필요 없죠.",
    "라면": "라면엔 김치, 그리고 계란 하나 톡 추가요.",
    "곱창": "곱창엔 볶음밥으로 마무리하는 거 잊으면 안 되죠.",
    "닭발": "닭발엔 시원한 맥주 한 잔이 필수 아니겠어요.",
    "초밥": "초밥엔 미소국 하나 곁들이면 딱이에요."
};
const closingLines = [
    "맛있게 드시고, 살찌기 전에 가벼운 걷기 운동 하나 챙기시는 거 잊지 마세요!",
    "맛있게 드신 다음엔 30분 산책으로 가볍게 소화시켜 보는 것도 좋겠죠!",
    "오늘은 맛있게, 내일은 가볍게! 식후 짧은 산책 하나만 기억해 주세요.",
    "맛있게 드시고 나서 계단 몇 층만 오르내려도 마음이 한결 가벼워질 거예요.",
    "다 드신 후에 물 한 잔 마셔주면 속도 편하고 더 개운할 거예요.",
    "먹을 땐 행복하게, 다 먹고 나면 가볍게 스트레칭 한 번 어떠세요.",
    "오늘의 선택엔 후회 없이! 대신 내일 아침은 가볍게 시작해봐요.",
    "맛있게 드시고, 설거지라도 직접 하면서 몸 좀 움직여보는 것도 방법이죠.",
    "다 드신 후 10분만 걸어도 소화가 훨씬 편해질 거예요."
];
const timeSlots = [
    { hourFrom: 5, hourTo: 10, name: "아침", desc: "가볍게 하루를 시작하고 싶은 아침 시간대", heavyBonus: -0.5 },
    { hourFrom: 10, hourTo: 14, name: "점심", desc: "든든하게 채우고 싶은 점심시간", heavyBonus: 0.5 },
    { hourFrom: 14, hourTo: 17, name: "오후", desc: "괜히 뭔가 당기는 나른한 오후 시간대", heavyBonus: 0 },
    { hourFrom: 17, hourTo: 21, name: "저녁", desc: "하루를 든든하게 마무리하고 싶은 저녁 시간대", heavyBonus: 0.5 },
    { hourFrom: 21, hourTo: 24, name: "야식", desc: "다이어트의 최대 고비, 야식 시간대", heavyBonus: 1 },
    { hourFrom: 0, hourTo: 5, name: "야식", desc: "다이어트의 최대 고비, 야식 시간대", heavyBonus: 1 }
];
const calorieTiers = {
    "족발": "든든한 편", "보쌈": "든든한 편", "삼겹살": "든든한 편", "곱창": "든든한 편",
    "치킨": "든든한 편", "피자": "든든한 편", "짜장면": "든든한 편", "스테이크": "든든한 편",
    "국밥": "보통", "냉면": "보통", "라면": "보통", "떡볶이": "보통", "비빔밥": "보통",
    "파스타": "보통", "짬뽕": "보통", "순대": "보통", "닭발": "보통",
    "회": "가벼운 편", "샐러드": "가벼운 편", "초밥": "가벼운 편", "김밥": "가벼운 편",
    "물회": "가벼운 편", "콩국수": "가벼운 편"
};

function getSeason(month) {
    if (month >= 3 && month <= 5) return "spring";
    if (month >= 6 && month <= 8) return "summer";
    if (month >= 9 && month <= 11) return "autumn";
    return "winter";
}
function getTimeSlot(hour) {
    return timeSlots.find(t => hour >= t.hourFrom && hour < t.hourTo) || timeSlots[3];
}
function scoreMenu(text, seasonKey, timeSlot) {
    let score = 3;
    const isCold = (seasonKey === "winter" || seasonKey === "autumn");
    warmWords.forEach(w => { if (text.includes(w)) score += isCold ? 1 : 0.3; });
    coolWords.forEach(w => { if (text.includes(w)) score += !isCold ? 1 : 0.3; });
    const tier = findCalorieTierKey(text);
    if (tier === "든든한 편") score += timeSlot.heavyBonus;
    if (tier === "가벼운 편") score -= timeSlot.heavyBonus;
    return Math.max(score, 0.5);
}
function weightedPick(a, b, scoreA, scoreB) {
    const total = scoreA + scoreB;
    return (Math.random() * total < scoreA) ? a : b;
}
function findPairing(text) {
    const key = Object.keys(menuPairings).find(k => text.includes(k));
    return key ? menuPairings[key] : `${text} 옆엔 시원한 음료 하나 곁들이면 다 맛있어질 거예요.`;
}
function findCalorieTierKey(text) {
    const key = Object.keys(calorieTiers).find(k => text.includes(k));
    return key ? calorieTiers[key] : null;
}
function calorieComment(text) {
    const tier = findCalorieTierKey(text);
    if (tier === "든든한 편") return `${text}은(는) 한 끼로 든든한 편이니, 다음 끼니는 가볍게 조절해보는 것도 방법이에요.`;
    if (tier === "보통") return `${text}은(는) 부담 없이 즐기기 딱 좋은 정도예요.`;
    if (tier === "가벼운 편") return `${text}은(는) 상대적으로 가벼운 편이라 마음 편히 즐기셔도 좋아요.`;
    return `${text}의 정확한 칼로리는 case by case지만, 적당히 즐기면 크게 걱정 안 하셔도 돼요.`;
}

function recommendMenu() {
    const a = document.getElementById('menuA').value.trim();
    const b = document.getElementById('menuB').value.trim();
    const resultBox = document.getElementById('resultBox');
    const resultBadge = document.getElementById('resultBadge');
    const resultTitle = document.getElementById('resultTitle');
    const resultDesc = document.getElementById('resultDesc');
    const resultPairing = document.getElementById('resultPairing');

    if (!a || !b) {
        alert('고민되는 두 가지 메뉴를 모두 입력해 주세요!');
        return;
    }

    const now = new Date();
    const seasonKey = getSeason(now.getMonth() + 1);
    const info = seasonInfo[seasonKey];
    const timeSlot = getTimeSlot(now.getHours());
    const isRainy = Math.random() < 0.3;

    const picked = weightedPick(a, b, scoreMenu(a, seasonKey, timeSlot), scoreMenu(b, seasonKey, timeSlot));
    const alternative = (picked === a) ? b : a;

    const contextLine = isRainy
        ? `오늘같이 비 오는 날엔 뜨끈하거나 든든한 게 당기기 마련이죠.`
        : Math.random() < 0.5
            ? `${info.desc}엔 아무래도 <strong>${picked}</strong>가 먼저 생각나네요.`
            : `${timeSlot.desc}엔 <strong>${picked}</strong> 쪽으로 마음이 기우네요.`;

    const tips = [
        `오늘은 왠지 <strong>${picked}</strong>의 기운이 강하게 이끌리네요! ${contextLine} ${alternative}도 아쉽겠지만, 오늘 만큼은 확실하게 입 호강 시켜주세요.`,
        `운명의 선택은 바로 돌고 돌아 <strong>${picked}</strong>입니다! (${alternative}야 다음에 만나자...) ${contextLine} 칼로리는 잠시 눈감아 주기로 해요.`,
        `고민은 그만! 오늘의 승자는 <strong>${picked}</strong>입니다. ${contextLine} ${alternative}의 유혹을 물리치고 선택된 만큼 후회 없이 드세요.`
    ];
    const randomTip = tips[Math.floor(Math.random() * tips.length)] + ` ` + closingLines[Math.floor(Math.random() * closingLines.length)];

    resultBadge.textContent = `${info.name} · ${timeSlot.name} 시간대 · ${isRainy ? "비 오는 날" : "맑은 날"} 기준`;
    resultTitle.innerHTML = `🎉 오늘의 운명적 선택: <span style="color:#222;">${picked}</span>`;
    resultDesc.innerHTML = randomTip;
    resultPairing.innerHTML = `✨ 추천 꿀조합: ${findPairing(picked)}<br>🔥 칼로리 귀띔: ${calorieComment(picked)}`;
    resultBox.style.display = 'block';
}
</script>
