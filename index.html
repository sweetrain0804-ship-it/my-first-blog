
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 글감 추천기</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px 20px; background: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        h1 { font-size: 20px; color: #333; }
        button { background: #007bff; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 20px; }
        #result { margin-top: 25px; font-weight: bold; font-size: 18px; color: #007bff; }
    </style>
</head>
<body>
    <div class="card">
        <h1>💡 오늘의 AI 글감 추천기</h1>
        <button onclick="getTopic()">글감 추천받기</button>
        <div id="result">버튼을 눌러주세요!</div>
    </div>

    <script>
        const topics = [
            "초보자를 위한 AI 활용법 Top 5",
            "스마트폰 하나로 시작하는 블로그 운영 팁",
            "2026년 주목해야 할 기술 트렌드 정리",
            "생산성을 2배로 올려주는 추천 도구",
            "SEO 최적화를 위한 첫걸음 가이드"
        ];
        function getTopic() {
            const random = topics[Math.floor(Math.random() * topics.length)];
            document.getElementById('result').innerText = random;
        }
    </script>
</body>
</html>
