<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 글감 추천기 Pro</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            padding: 40px 20px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            box-sizing: border-box;
        }
        .card { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 35px 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            max-width: 400px; 
            width: 100%;
        }
        h1 { font-size: 22px; color: #333; margin-bottom: 25px; }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 25px; }
        button { 
            background: #4F46E5; 
            color: white; 
            border: none; 
            padding: 14px 20px; 
            font-size: 16px; 
            font-weight: bold;
            border-radius: 12px; 
            cursor: pointer; 
            flex: 1;
            transition: background 0.2s;
        }
        button:active { background: #4338CA; }
        #copyBtn { background: #10B981; display: none; }
        #copyBtn:active { background: #059669; }
        #result { 
            margin-top: 20px; 
            font-weight: 600; 
            font-size: 19px; 
            color: #1F2937; 
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: keep-all;
            line-height: 1.4;
            background: #F3F4F6;
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>💡 오늘의 AI 글감 추천기</h1>
        <div id="result">아래 버튼을 눌러 글감을 추천받으세요!</div>
        <div class="btn-group">
            <button onclick="getTopic()">🎰 글감 추천받기</button>
            <button id="copyBtn" onclick="copyTopic()">📋 복사하기</button>
        </div>
    </div>

    <script>
        const topics = [
            "2026년 최신 알뜰폰 요금제 비교 및 이동 통신비 절약 팁",
            "초보자도 따라하는 Google AdSense 승인 및 수익화 가이드",
            "스마트폰 하나로 블로그 포스팅 완성하는 모바일 작성 노하우",
            "HBM 반도체 시장 동향과 주요 기업 관련 이슈 정리",
            "에너지 저장 장치(ESS) 시장의 성장 가능성과 핵심 정리",
            "SNS 콘텐츠 인게이지먼트를 높이는 캡션 작성 테크닉",
            "초보자도 쉬운 제휴 마케팅 자동화 팁",
            "생산성을 높여주는 유용한 AI 자동화 툴 추천 5선",
            "스마트폰 전용 블로그 템플릿 최적화 및 SEO 설정법",
            "GitHub Pages를 이용해 스마트폰으로 만드는 나만의 웹 앱",
            "요즘 주목받는 차세대 데이터 센터 및 기술 트렌드 분석",
            "우주 테크와 위성 데이터 처리 기술의 최신 동향 정리",
            "K-POP 및 엔터테인먼트 마케팅의 최신 트렌드 분석",
            "블로그 방문자 수를 2배로 늘리는 검색 키워드 발굴법",
            "시간을 아껴주는 모바일 전용 필수 생산성 앱 모음"
        ];

        function getTopic() {
            const random = topics[Math.floor(Math.random() * topics.length)];
            const resultDiv = document.getElementById('result');
            resultDiv.innerText = random;
            document.getElementById('copyBtn').style.display = 'block';
        }

        function copyTopic() {
            const text = document.getElementById('result').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert('글감이 클립보드에 복사되었습니다!');
            });
        }
    </script>
</body>
</html>
